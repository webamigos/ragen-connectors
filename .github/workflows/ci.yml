name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `lint` declares dependsOn ["^build"], so turbo builds core first (ADR-06).
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `typecheck` declares dependsOn ["^build"], so turbo builds core first (ADR-06).
      - run: npm run typecheck

  test:
    name: Test & Coverage
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `test` is a root Vitest run outside turbo, and services resolve
      # @ragen-connectors/core through its built dist/ — so this build is required.
      - run: npm run build
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const d = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total;
            console.log('Coverage Summary:');
            for (const [k,v] of Object.entries(d)) console.log('  ' + k + ': ' + v.pct + '%');
          "
      - name: Coverage report (PR comment)
        if: always() && github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1.0.32
        with:
          coverage-summary-path: coverage/coverage-summary.json

  build:
    name: Build
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
