# Local development. Joins the ragen-network so all projects can coexist.
services:
  app:
    build:
      context: ../..
      dockerfile: services/hubspot/Dockerfile
    ports:
      - "8003:8003"
      - "9003:9003"
    env_file: .env.local
    environment:
      PORT: "8003"
    restart: unless-stopped
    networks:
      - ragen-network

networks:
  ragen-network:
    name: ragen-network
    external: true
